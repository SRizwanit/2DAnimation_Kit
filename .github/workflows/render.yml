name: Render Hadis Video

on:
  workflow_dispatch:
    inputs:
      hadis_id:
        description: "হাদিস ডেটা ফাইলের নাম (data/ ফোল্ডার থেকে, .json ছাড়া)"
        required: true
        default: "hadis0000"
      orientation:
        description: "ভিডিওর ফরম্যাট"
        required: true
        default: "portrait"
        type: choice
        options:
          - portrait
          - landscape
          - both
      quality:
        description: "কোয়ালিটি (hd = 1080p, 4k = 2160p)"
        required: true
        default: "hd"
        type: choice
        options:
          - hd
          - 4k

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - name: Build orientation list
        id: m
        run: |
          if [ "${{ inputs.orientation }}" = "both" ]; then
            echo 'list=["portrait","landscape"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["${{ inputs.orientation }}"]' >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        orientation: ${{ fromJSON(needs.prepare.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data
        run: node scripts/validate.mjs "${{ inputs.hadis_id }}"

      - name: Ensure Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render (${{ matrix.orientation }} / ${{ inputs.quality }})
        run: >
          node scripts/render.mjs
          --id="${{ inputs.hadis_id }}"
          --orientation="${{ matrix.orientation }}"
          --quality="${{ inputs.quality }}"

      # প্রতিটি render job শেষ হলেই নিজের artifact আপলোড হবে (both হলেও অপেক্ষা করতে হয় না)
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.hadis_id }}-${{ matrix.orientation }}-${{ inputs.quality }}
          path: out/*.mp4
          retention-days: 14
          if-no-files-found: error
